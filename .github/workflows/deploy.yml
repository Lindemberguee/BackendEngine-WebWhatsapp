name: Backend Deploy

# Runs after CI succeeds on main — SSHes into the VPS and redeploys via
# Backend/scripts/deploy.sh. Requires these repo secrets to be set (Settings →
# Secrets and variables → Actions) before this can do anything:
#   VPS_HOST      — the server's IP/hostname
#   VPS_USER      — the SSH user to deploy as
#   VPS_SSH_KEY   — private key for that user (public half must be in the VPS's authorized_keys)
#
# One-time setup on the VPS itself (not automated — do this once by hand):
#   1. Install Docker + the Docker Compose plugin.
#   2. git clone <this repo's URL> /opt/app
#   3. Create /opt/app/Backend/.env with real production values (see .env.example).
#   4. Run `docker compose -f /opt/app/Backend/docker-compose.yml up -d` once manually
#      to confirm it boots, before relying on this workflow for future deploys.

on:
  workflow_run:
    workflows: ['Backend CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /opt/app/Backend/scripts/deploy.sh
